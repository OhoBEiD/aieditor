# fly.toml - Deploy n8n on Fly.io
# Run: fly launch --config fly.toml

app = "n8n-ai-editor"
primary_region = "cdg"  # Paris - close to you

[build]
  image = "n8nio/n8n:latest"

[env]
  N8N_HOST = "0.0.0.0"
  N8N_PORT = "5678"
  N8N_PROTOCOL = "https"
  WEBHOOK_URL = "https://n8n-ai-editor.fly.dev/"
  N8N_SECURE_COOKIE = "false"
  EXECUTIONS_TIMEOUT = "600"  # 10 minutes!
  EXECUTIONS_TIMEOUT_MAX = "3600"  # 1 hour max
  N8N_PAYLOAD_SIZE_MAX = "64"
  GENERIC_TIMEZONE = "Europe/Paris"
  # Set your GitHub token as a secret
  # fly secrets set GITHUB_TOKEN=ghp_your_token

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "n8n_data"
  destination = "/home/node/.n8n"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
